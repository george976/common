<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Interviewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;500&display=swap">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mut:#6b6a64;--line:#e4e2da;--acc:#4f46e5;--acc2:#e8e6ff;--ok:#16a34a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1c1c20;--ink:#f1f0ec;--mut:#9a99a3;--line:#2c2c33;--acc:#8b85ff;--acc2:#2a2850;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121214;--card:#1c1c20;--ink:#f1f0ec;--mut:#9a99a3;--line:#2c2c33;--acc:#8b85ff;--acc2:#2a2850;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
h1{font-size:20px;margin:0}h1 span{color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut);background:var(--card)}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}.chip.done{border-color:var(--ok);color:var(--ok)}
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.videos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#15151a;display:flex;align-items:center;justify-content:center;color:#cfcfd8}
.tile .lbl{position:absolute;left:8px;bottom:8px;font-size:11px;background:rgba(0,0,0,.55);color:#fff;padding:2px 8px;border-radius:99px}
.tile video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.ring{position:absolute;inset:0;border:3px solid transparent;border-radius:12px;pointer-events:none}
.speaking .ring{border-color:var(--acc)}
#aiVideo{background:radial-gradient(circle at 50% 45%,#1d1a45,#07070f 75%)}
#aiVideo canvas{width:100%;height:100%;display:block}
.wave{display:flex;gap:4px;align-items:center;height:60px}
.wave i{width:6px;height:10px;border-radius:3px;background:#8b85ff;transition:height .1s}
.speaking .wave i{animation:b .6s ease-in-out infinite alternate}
.wave i:nth-child(2n){animation-delay:.15s}.wave i:nth-child(3n){animation-delay:.3s}
@keyframes b{to{height:52px}}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:10px}
button:hover{border-color:var(--acc)}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
button.off{opacity:.65;text-decoration:line-through}
.q{margin-top:12px;padding:12px;background:var(--acc2);border-radius:12px}
.q small{color:var(--mut);display:block;margin-bottom:2px}
.chat{height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.m{max-width:88%;padding:8px 12px;border-radius:12px;font-size:14px}
.m.ai{background:var(--acc2);align-self:flex-start}.m.me{background:var(--acc);color:#fff;align-self:flex-end}
textarea{width:100%;min-height:76px;margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar b{display:block;height:100%;background:var(--acc);border-radius:6px}
.sc{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;margin:8px 0}
.rec{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.rec h4{margin:0 0 4px}.tag{font-size:11px;color:var(--ok);font-weight:600}
.m.live{opacity:.7;font-style:italic}.rec-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;margin-right:6px;animation:p 1s infinite alternate}@keyframes p{to{opacity:.2}}#intro{position:fixed;inset:0;z-index:50;background:#06060c;color:#fff;transition:opacity .7s}#intro.fade{opacity:0;pointer-events:none}#intro canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.7));pointer-events:none}.lb{position:absolute;left:0;right:0;height:8vh;background:#000;z-index:2}.lb.t{top:0}.lb.b{bottom:0}
.itop{position:absolute;z-index:4;right:12px;top:calc(env(safe-area-inset-top,0px) + 8vh + 10px);display:flex;gap:8px}.itop button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.28);backdrop-filter:blur(6px)}
.icapw{position:absolute;z-index:3;left:0;right:0;bottom:calc(8vh + 22px);text-align:center;padding:0 20px}#icap{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-size:clamp(30px,6vw,64px);font-weight:500;letter-spacing:.03em;text-shadow:0 2px 30px rgba(0,0,0,.9)}#isub{font-family:Inter,system-ui,sans-serif;font-weight:300;font-size:clamp(11px,1.6vw,15px);letter-spacing:.22em;text-transform:uppercase;color:#e8d3a8;opacity:.92;margin-top:12px}
.swap{animation:cap .9s ease both}@keyframes cap{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}#iBegin{margin-top:22px;font:500 12px Inter,system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;padding:14px 32px;border-radius:99px;background:linear-gradient(135deg,#f3dfb2,#c9a45c);color:#1a1405;border:0;box-shadow:0 8px 30px rgba(201,164,92,.35)}#ipg{position:absolute;z-index:4;left:0;bottom:0;height:3px;width:0;background:#8b85ff}
.m.warn{border-left:3px solid #f59e0b}.spin{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.two{grid-template-columns:1fr}}.big{font-size:44px;font-weight:700;color:var(--acc);line-height:1}.big small{font-size:16px;color:var(--mut)}.ov{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.ov p{flex:1;min-width:220px;margin:0}.mut{color:var(--mut)}
select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 8px;border-radius:10px;max-width:180px}.hide{display:none}.note.err{color:#ef4444}.note{color:var(--mut);font-size:12px;margin-top:6px}
#bInt{border-color:#ef4444;color:#ef4444}.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);padding:0 4px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🎙️ <span>AI</span> Interviewer</h1>
  <div class="chips" id="chips"></div>
</header>

<div id="interview" class="grid">
  <section class="card">
    <div class="videos">
      <div class="tile" id="aiTile">
        <div id="aiVideo" style="width:100%;height:100%"></div>
        <div id="aiAudio" class="wave hide"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="ring"></div><span class="lbl">AI interviewer</span>
      </div>
      <div class="tile" id="meTile">
        <video id="cam" autoplay muted playsinline class="hide"></video>
        <div id="camOff" style="text-align:center;font-size:13px">📷 Camera off<br><small>Your video is private</small></div>
        <span class="lbl">You</span>
      </div>
    </div>
    <div class="ctrl">
      <button id="bCam">📷 Turn camera on</button>
      <button id="bMic">🎤 Start voice</button>
      <button id="bInt" class="hide">✋ Interrupt</button>
      <label class="chk"><input type="checkbox" id="autoSend" checked> Auto-send</label>
      <select id="vSel" title="AI voice"><option value="nova">Voice: Nova</option><option value="shimmer">Shimmer</option><option value="alloy">Alloy</option><option value="echo">Echo</option><option value="fable">Fable</option><option value="onyx">Onyx</option></select>
      <button id="bAiVid">🧑‍💼 Interviewer video: on</button>
      <button id="bSound">🔊 Voice: on</button>
      <button id="bReplay">🎬 Replay intro</button>
      <button id="bTheme">🌓</button>
    </div>
    <div class="note" id="camNote"></div>
    <div class="note" id="micMsg"></div>
    <div class="q"><small id="qMeta">Question</small><div id="qText" style="font-weight:600"></div></div>
  </section>

  <section class="card">
    <div class="chat" id="chat"></div>
    <textarea id="ans" placeholder="Type your answer… or load a sample response"></textarea>
    <div class="row">
      <button id="bSample">✨ Use sample response</button>
      <button class="pri" id="bSend">Send answer →</button>
      <button id="bAuto" title="Plays the whole interview with sample answers">▶ Auto-demo</button>
    </div>
  </section>
</div>

<section id="report" class="card hide"></section>
<div id="intro">
  <div class="lb t"></div><div class="lb b"></div><div class="vig"></div>
  <div class="itop"><button id="iSnd">🔇 Narration off</button><button id="iSkip">Skip ›</button></div>
  <div class="icapw"><div id="icap"></div><div id="isub"></div><button class="pri hide" id="iBegin">Begin interview →</button></div>
  <div id="ipg"></div>
</div>
</div>

<script>
const DOMAINS=[
{k:"Product",ic:"🧩",q:"Tell me about a product you shaped. How did you decide what to build, and what did you deliberately leave out?",kw:["user","priorit","metric","roadmap","trade","research","launch","mvp"],
 s:"I led a scheduling feature for freelancers. We interviewed 25 users, found double-booking was the top pain, and prioritised it using impact versus effort. I cut calendar themes and team views from the MVP. After launch, weekly retention rose 12% and support tickets fell by a third, so we reinvested in the roadmap around reliability."},
{k:"Business",ic:"📈",q:"Imagine our subscription revenue is flat for two quarters. How would you diagnose it and what would you do first?",kw:["churn","revenue","cohort","margin","pricing","segment","unit","growth"],
 s:"I’d split revenue into new, expansion and churn by cohort and segment. If churn is the leak, I’d fix onboarding before touching pricing. Then I’d check unit economics, CAC payback and margin by segment, and run a pricing test on the healthiest cohort."},
{k:"AI Fluency",ic:"🤖",q:"How do you use AI in your daily work, and how do you judge when its output can’t be trusted?",kw:["prompt","llm","evaluate","hallucin","workflow","automat","verify","model","data"],
 s:"I use LLMs for research synthesis, drafting and spreadsheet automation. I write structured prompts with examples, then verify claims against sources because models hallucinate. For team workflows I built a small evaluation set to compare models before rollout, and I keep humans in the loop for anything customer-facing."},
{k:"Technology",ic:"⚙️",q:"Walk me through how you’d work with engineers to ship something technically complex under a tight deadline.",kw:["api","architecture","scal","debt","estimate","engineer","deploy","risk"],
 s:"I’d align on scope with the tech lead, ask for estimates, and flag risks early. We’d split the work behind a feature flag, agree on the API contract first, and accept some tech debt with a ticket to repay it. I stay close to deploys so we can roll back quickly."},
{k:"Marketing",ic:"📣",q:"How would you position and launch a new product to an audience that has never heard of us?",kw:["audience","position","channel","brand","content","funnel","message","campaign"],
 s:"I’d define one sharp audience and a clear positioning message. Then pick two channels, such as content and communities, and measure the funnel from awareness to signup."},
{k:"Sales",ic:"🤝",q:"A prospect says ‘you’re too expensive.’ Walk me through how you’d handle that conversation.",kw:["discover","value","objection","pipeline","close","stakeholder","roi","negotiat"],
 s:"I’d pause and ask what they’re comparing us to, then revisit the pain we uncovered in discovery. I’d quantify ROI, bring in the economic stakeholder, and only negotiate on scope or term, never on value, to keep the pipeline healthy and close on fair terms."}
];
const BANK={
Product:[
["Tell me about a product you shaped. How did you decide what to build, and what did you deliberately leave out?","I led a scheduling feature. After 25 user interviews I prioritised double-booking fixes by impact versus effort, cut themes from the MVP, and retention rose 12% after launch."],
["How do you prioritise a roadmap when stakeholders all say their request is urgent?","I score requests on user impact, strategic fit and effort, share the trade-off openly, and tie the roadmap to one metric so priorities stay defensible."],
["Describe a feature that failed. What did you learn?","We shipped a dashboard nobody used. Research showed we skipped user discovery, so I now validate with prototypes and track a clear adoption metric before building."],
["How do you define and measure product success?","I pick a north-star metric, such as weekly active teams, backed by activation and retention metrics, and review cohorts after every launch."],
["How do you run user research when you have little time and budget?","I do five quick user interviews, review support tickets, and test a clickable prototype before committing engineering time to an MVP."],
["Walk me through taking an idea from zero to launch.","I frame the problem, run research, define an MVP, align engineering on scope, launch to a small cohort, then iterate using metrics before a wider launch."],
["How do you say no to a feature request from a senior executive?","I acknowledge the goal, show data on trade-offs against the roadmap, offer a cheaper experiment, and agree on a metric that would justify building it."],
["What makes a great PRD or product spec?","It states the user problem, success metrics, scope and non-goals, with clear trade-offs and open questions, so engineering and design can move fast."],
["How would you improve onboarding for a product losing users in week one?","I’d analyse the funnel to find the drop-off, interview churned users, test a shorter setup with an MVP checklist, and measure activation uplift."],
["How do you balance new features with fixing technical debt?","I reserve roughly 20% of each cycle for debt, tie it to user metrics like speed and reliability, and explain the trade-off in roadmap terms."]],
Business:[
["Imagine our subscription revenue is flat for two quarters. How would you diagnose it and what would you do first?","I’d split revenue into new, expansion and churn by cohort and segment, fix churn through onboarding first, then test pricing and check margin and unit economics."],
["How would you decide whether to enter a new market?","I’d size the segment, test demand with a small pilot, check unit economics and margin, and compare growth upside against the cost and risk."],
["Walk me through how you’d evaluate unit economics for a product.","I’d compute CAC, lifetime revenue, gross margin and payback period by segment, then find which cohort is profitable and focus growth there."],
["How do you approach pricing a new product?","I combine customer value research, competitor benchmarks and margin targets, test two price points with a segment, and watch conversion and revenue."],
["Describe a time you made a decision with incomplete data.","I ran a small pilot to cut risk, defined the metric that would change my mind, and committed once early revenue signals were clear."],
["How would you reduce customer churn?","I’d analyse churn by cohort, interview lost customers, improve onboarding, and launch a proactive retention workflow for at-risk segments."],
["How do you build a business case for a new investment?","I model cost, expected revenue and margin under three scenarios, show payback and risks, and propose staged funding tied to metrics."],
["What metrics would you put on a CEO dashboard?","Revenue growth, churn, CAC payback, gross margin, cash runway and pipeline by segment, so leadership sees growth and unit health together."],
["How do you think about partnerships as a growth lever?","I look for partners sharing my audience, model the revenue split and margin, pilot one integration, and track referral growth before scaling."],
["A competitor just undercut us on price. What do you do?","I check which segment is affected, compare value rather than price, protect margin, and test targeted pricing or bundles before any broad cut."]],
"AI Fluency":[
["How do you use AI in your daily work, and how do you judge when its output can’t be trusted?","I use an LLM for research and drafting, write structured prompts, verify claims against sources because of hallucination, and keep a human in the workflow."],
["How would you evaluate whether an LLM is good enough for a customer-facing feature?","I’d build an evaluation set of real cases, compare models on accuracy and safety, measure hallucination rates, and add human review before launch."],
["What is prompt engineering, and what techniques do you use?","It’s designing instructions so a model behaves reliably. I use clear roles, examples, structured output formats and step-by-step prompts, then test variations on real data."],
["Explain hallucinations to a non-technical executive and how to mitigate them.","A model can state confident falsehoods. I reduce it by grounding answers in company data, requiring citations, verifying outputs and using human review."],
["Where would AI not be the right solution?","When errors are costly, data is scarce, or a simple rule works. I compare model cost and risk against a basic workflow automation first."],
["How would you design a workflow that automates support tickets with AI?","I’d classify tickets, draft replies from our knowledge base data, route low-confidence cases to humans, and evaluate quality weekly."],
["How do you handle data privacy when using AI tools?","I avoid sending sensitive data to public models, use approved vendors with data controls, anonymise inputs, and verify compliance with the security team."],
["What is RAG and when would you use it?","Retrieval-augmented generation fetches relevant company data and feeds it to the model, so answers are grounded. I use it for knowledge bases and to reduce hallucination."],
["How do you stay current with fast-moving AI developments?","I follow model releases, test new tools on my own workflow, read evaluation benchmarks critically, and run small experiments before recommending adoption."],
["How would you measure the ROI of an AI initiative?","I baseline the manual workflow, then measure time saved, quality via an evaluation set, and cost per task, and compare against model and rollout costs."]],
Technology:[
["Walk me through how you’d work with engineers to ship something technically complex under a tight deadline.","I align scope with the tech lead, get engineer estimates, flag risk early, agree the API first, ship behind a flag, and log any tech debt."],
["Explain what an API is to a non-technical stakeholder.","An API is a contract that lets two systems talk, like a waiter taking orders to the kitchen. It lets partners integrate without seeing our internal architecture."],
["How do you decide between building and buying a technical solution?","I compare cost, time to deploy, differentiation and risk. If it isn’t core, I buy; if it’s our edge, I build with an engineer estimate."],
["How do you think about scalability early in a product’s life?","I avoid over-engineering, but choose an architecture that scales with load, monitor bottlenecks, and plan refactors as usage and risk grow."],
["How do you handle a production outage?","I coordinate engineers, communicate clearly to stakeholders, prioritise a rollback or fix to restore service, then run a blameless review to cut risk."],
["What’s your approach to managing technical debt?","I make it visible, estimate its cost to speed and risk, schedule a share of each sprint to repay it, and agree trade-offs with engineers."],
["How would you explain cloud architecture trade-offs to leadership?","I frame choices in cost, speed, reliability and risk, show a simple architecture diagram, and recommend an option with an estimate of scale."],
["How do you ensure data security in a product you manage?","I work with engineers on access controls, encryption and audits, review vendor risk, and include security requirements before deploy rather than after."],
["What technical skills do you use most as a non-engineer?","I read API docs, write SQL for data questions, understand architecture diagrams, and review estimates with engineers to challenge scope and spot risk."],
["How do you evaluate a new technology before adopting it?","I define the problem, prototype quickly, test scale and security risk, check cost, and have engineers review the architecture before a wider deploy."]],
Marketing:[
["How would you position and launch a new product to an audience that has never heard of us?","I’d define one sharp audience and a clear positioning message, pick two channels like content and communities, and measure the funnel from awareness to signup."],
["How do you decide which marketing channels to invest in?","I test small campaigns across channels, compare cost per acquisition through the funnel, and double down on the channel where the audience converts best."],
["How would you build a brand from scratch on a small budget?","I define a clear position and message, create useful content for one audience, build community, and measure brand search and funnel growth."],
["Walk me through a campaign you ran and its results.","I ran a launch campaign with email and content, tested messages, tracked the funnel weekly, and cut acquisition cost by 30% over the campaign."],
["How do you measure marketing effectiveness?","I track the funnel from visits to signups to revenue, attribute by channel, watch CAC and payback, and review each campaign against its goal."],
["How would you write a value proposition for a B2B product?","I’d define the audience pain, state the outcome in one clear message, back it with proof, and test the position with customers."],
["How do content and SEO fit into your growth strategy?","Content builds trust and compounding organic funnel traffic. I target audience questions, build topic clusters, and measure rankings and signups per channel."],
["How do you approach customer segmentation?","I segment by need and behaviour using data and interviews, tailor the message per audience, and prioritise the segment with the best funnel economics."],
["Tell me about a campaign that underperformed.","A campaign missed because the message didn’t fit the audience. I reviewed funnel data, interviewed customers, rewrote the positioning, and relaunched with better results."],
["How would you work with sales to generate better leads?","I agree a lead definition with sales, tailor content and campaign messages to the buyer, and review funnel conversion together every week."]],
Sales:[
["A prospect says ‘you’re too expensive.’ Walk me through how you’d handle that conversation.","I’d ask what they’re comparing us to, revisit the pain from discovery, quantify ROI, involve the economic stakeholder, and negotiate scope not value."],
["How do you structure a discovery call?","I open with their goals, ask about pain and impact, map stakeholders and the buying process, and confirm value before proposing any next step in the pipeline."],
["How do you build and manage your pipeline?","I prospect weekly, qualify with clear criteria, review pipeline stages every week, and focus time on deals with real stakeholder access to close."],
["Tell me about the biggest deal you closed.","It was a six-figure deal. I ran discovery, mapped stakeholders, built an ROI case, handled objection on security, and negotiated a fair term to close."],
["How do you handle a stalled deal?","I re-engage the champion, find the blocker, reconfirm the value and ROI, bring in a new stakeholder if needed, and set a clear close date."],
["How do you qualify a lead?","I check budget, authority, need and timing during discovery, confirm the pain and stakeholder involvement, and only advance real deals in the pipeline."],
["How do you prepare for a negotiation?","I know my walk-away point, understand their stakeholder priorities and ROI, plan trades on scope and term, and protect value while closing fairly."],
["How do you sell to a skeptical buyer?","I listen to the objection in discovery, use proof like case studies and ROI, offer a small pilot, and involve a trusted stakeholder to reduce risk."],
["How do you work with customers after the deal closes?","I hand off with a clear success plan, check in on value delivered, spot expansion in the pipeline, and keep stakeholders happy to protect renewal."],
["How do you hit quota in a slow quarter?","I audit the pipeline, prioritise deals nearest to close, run focused outbound discovery, offer value-based incentives, and negotiate timing with stakeholders."]]
};
DOMAINS.forEach(d=>{const p=BANK[d.k][Math.floor(Math.random()*BANK[d.k].length)];d.q=p[0];d.s=p[1]});
const COMPANIES={
Product:["Product-led SaaS scale-ups","Series B–D teams building self-serve products where PMs own outcomes (e.g. workflow, fintech and collaboration tools)."],
Business:["High-growth startups & strategy-led firms","Seed–Series B startups and consultancies that need a commercially minded generalist across revenue, pricing and operations."],
"AI Fluency":["AI-native startups & applied-AI teams","Companies building on LLMs, agents or automation, where practical AI judgement is a core hiring signal."],
Technology:["Developer tools, infra & platform companies","Technical-product roles at API, cloud, data and security businesses that value engineering credibility."],
Marketing:["Consumer brands & growth-stage D2C","Brand and growth teams in consumer apps, marketplaces and D2C companies with heavy top-of-funnel focus."],
Sales:["B2B SaaS & enterprise sales-led companies","Revenue teams with complex deals, long cycles and multi-stakeholder buying (customer success and solutions roles too)."]};

let i=0,scores=[],answers=[],voice=true,aiVid=true,stream=null,speaking=false,busy=false;
const $=id=>document.getElementById(id);

function chips(){$("chips").innerHTML=DOMAINS.map((d,n)=>`<span class="chip ${n<i?'done':n===i?'on':''}">${d.ic} ${d.k}</span>`).join("")}
function add(role,t){const d=document.createElement("div");d.className="m "+role;d.textContent=t;$("chat").appendChild(d);$("chat").scrollTop=1e9}

// ---- AI voice: OpenAI TTS via backend (browser voice as fallback), with barge-in ----
const player=new Audio();player.preload="auto";
let actx=null,playAn=null,sayId=0,ttsCtl=null,endCurrent=null,ttsWarned=false;
const ttsCache=new Map();

async function transcribe(blob){
  const ctrl=new AbortController(),to=setTimeout(()=>ctrl.abort(),45000);
  try{
    const fd=new FormData();
    fd.append("audio",blob,"speech.wav");
    // Improvement 3: always send an explicit language to avoid wrong-language output.
    fd.append("language","en");
    // Optional vocabulary hint: helps with names / domain terms in interview answers.
    fd.append("prompt","Job interview answer in English. Names, companies, product and technical terms.");
    const r=await fetch(API_URL+"/api/transcribe",{method:"POST",body:fd,signal:ctrl.signal});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.success)throw new Error(j.message||("Server returned "+r.status));
    return{text:j.text,model:j.model};
  }finally{clearTimeout(to)}
}

// Voice-activity detection. Speech must stay above an adaptive threshold for a short time.
// While the AI is talking the bar is higher, so its own voice leaking into the mic doesn’t trigger it.
function vad(ml){
  const thr=Math.min(.12,Math.max(.02,noise*3))*(speaking?1.6:1),loud=ml>thr;
  if(recState==="idle"){
    if(!loud){noise=Math.min(.05,noise*.97+ml*.03);loudMs=0;return}
    startRec();if(!capturing)return;
    recState="candidate";loudMs=TICK;quietMs=0;voicedMs=TICK;
  }else if(recState==="candidate"){
    if(loud){loudMs+=TICK;voicedMs+=TICK;quietMs=0}else{quietMs+=TICK;if(quietMs>250){cancelRec();return}}
    if(loudMs>=(speaking?320:140)){
      recState="recording";
      if(speaking)interruptAI(); // barge-in: cut the AI off immediately
      micStatus("🔴 Recording… pause when you’re done.");
    }
  }else if(recState==="recording"){
    if(loud){voicedMs+=TICK;quietMs=0}else quietMs+=TICK;
    if(quietMs>=SILENCE_MS||performance.now()-recStartAt>MAX_REC_MS)stopRec();
  }
}
